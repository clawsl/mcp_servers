# ================================================================
# Sequential Thinking MCP Server - Distroless Docker Compose
# ================================================================
#
# This docker-compose configuration deploys the distroless version
# of the Sequential Thinking MCP Server with maximum security hardening.
#
# Features:
# - Distroless base image (no shell, no package manager)
# - Read-only root filesystem
# - Non-root user (UID 65532)
# - Resource limits (1GB memory, 1 CPU)
# - Security-hardened configuration
# - Persistent log storage
#
# Usage:
#   # Start services
#   docker-compose -f docker-compose.distroless.yml up -d
#
#   # View logs
#   docker-compose -f docker-compose.distroless.yml logs -f
#
#   # Stop services
#   docker-compose -f docker-compose.distroless.yml down
#
#   # Rebuild and restart
#   ./build-distroless.sh && docker-compose -f docker-compose.distroless.yml up -d --force-recreate
#
# ================================================================

# version: '3.8'

services:
  # ================================================================
  # Sequential Thinking MCP Server (Distroless)
  # ================================================================
  sequential-thinking-distroless:
    # Use the distroless image built by build-distroless.sh
    image: mcp/sequentialthinking:distroless

    # Build configuration (if image doesn't exist)
    build:
      context: .
      dockerfile: Dockerfile.distroless
      platforms:
        - linux/amd64
        - linux/arm64
      args:
        - BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        - VCS_REF=$(git rev-parse --short HEAD || echo "unknown")

    container_name: seq-thinking-distroless

    # Restart policy
    restart: unless-stopped

    # ============================================================
    # Security Configuration
    # ============================================================

    # Read-only root filesystem (immutable container)
    read_only: true

    # tmpfs mounts for temporary files (in-memory, volatile)
    tmpfs:
      # /tmp for general temporary files
      - /tmp:mode=1777,size=100m,uid=65532,gid=65532,noexec,nosuid,nodev
      # /run for runtime files (optional)
      - /run:mode=0755,size=10m,uid=65532,gid=65532,noexec,nosuid,nodev

    # Persistent volume for logs
    volumes:
      # Logs directory (writable, persistent)
      - ./logs:/app/logs:rw
      # Optional: Mount custom configuration
      # - ./config:/app/config:ro

    # Security options
    security_opt:
      # Prevent privilege escalation
      - no-new-privileges:true
      # AppArmor profile (optional, uncomment if available)
      # - apparmor=docker-default
      # Seccomp profile (optional, for additional syscall filtering)
      # - seccomp=seccomp-profile.json

    # Drop all capabilities, then add only required ones
    cap_drop:
      - ALL
    cap_add:
      # Required for binding to port 3001
      - NET_BIND_SERVICE
      # Required for log file ownership
      - CHOWN
      # Required for user/group operations
      - SETGID
      - SETUID

    # ============================================================
    # Resource Limits
    # ============================================================

    # Memory limits (prevents DoS via memory exhaustion)
    mem_limit: 1g
    memswap_limit: 1g  # Same as mem_limit = no swap
    mem_reservation: 512m

    # CPU limits
    cpus: '1.0'  # Limit to 1 CPU core

    # Process limits
    pids_limit: 100  # Prevent fork bombs

    # ============================================================
    # Environment Variables
    # ============================================================
    environment:
      # Server configuration
      - PORT=3001
      - NODE_ENV=production

      # Security configuration
      - MAX_THOUGHTS_PER_SESSION=10000
      - SESSION_TIMEOUT_MS=3600000

      # Logging configuration
      - LOG_LEVEL=info
      - DISABLE_THOUGHT_LOGGING=false

      # Optional: Custom configuration
      # - CORS_ORIGINS=http://localhost:*
      # - RATE_LIMIT_WINDOW_MS=60000
      # - RATE_LIMIT_MAX_REQUESTS=100

    # ============================================================
    # Network Configuration
    # ============================================================

    # Bind to localhost only for security
    ports:
      - "127.0.0.1:3002:3001"

    # Optional: Custom network (for isolation)
    # networks:
    #   - mcp-network

    # ============================================================
    # Health Check
    # ============================================================
    # Note: Distroless doesn't have curl, so health check is done externally
    # We rely on Docker's internal health monitoring and external monitoring

    # External health check (run from host):
    #   curl http://localhost:3001/health

    # For Docker Swarm or Kubernetes, use liveness/readiness probes:
    # healthcheck:
    #   test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
    #   interval: 30s
    #   timeout: 3s
    #   start_period: 5s
    #   retries: 3

    # ============================================================
    # Labels (for monitoring and management)
    # ============================================================
    labels:
      # Application labels
      - "app.name=sequential-thinking"
      - "app.version=0.6.2"
      - "app.component=mcp-server"
      - "app.type=distroless"

      # Security labels
      - "security.distroless=true"
      - "security.read-only-root=true"
      - "security.non-root=true"
      - "security.no-shell=true"

      # Monitoring labels
      - "monitoring.prometheus.scrape=true"
      - "monitoring.prometheus.port=3002"
      - "monitoring.prometheus.path=/health"

# ================================================================
# Optional: Custom Networks
# ================================================================
# Uncomment to create isolated network
# networks:
#   mcp-network:
#     driver: bridge
#     ipam:
#       config:
#         - subnet: 172.20.0.0/16

# ================================================================
# Optional: Volumes Configuration
# ================================================================
# If you want to use named volumes instead of bind mounts:
# volumes:
#   mcp-logs:
#     driver: local

# ================================================================
# Usage Examples
# ================================================================
#
# Start services:
#   docker-compose -f docker-compose.distroless.yml up -d
#
# View logs:
#   docker-compose -f docker-compose.distroless.yml logs -f sequential-thinking-distroless
#
# Check status:
#   docker-compose -f docker-compose.distroless.yml ps
#
# Test health:
#   curl http://localhost:3001/health
#
# Test SSE connection:
#   curl -N http://localhost:3001/sse
#
# Stop services:
#   docker-compose -f docker-compose.distroless.yml down
#
# Rebuild and restart:
#   ./build-distroless.sh
#   docker-compose -f docker-compose.distroless.yml up -d --force-recreate
#
# View resource usage:
#   docker stats seq-thinking-distroless
#
# Inspect security:
#   docker inspect seq-thinking-distroless | jq '.[0].HostConfig'
#
# ================================================================
# Security Validation
# ================================================================
#
# Verify read-only root filesystem:
#   docker inspect seq-thinking-distroless | jq '.[0].HostConfig.ReadonlyRootfs'
#   # Should return: true
#
# Verify user:
#   docker exec seq-thinking-distroless whoami
#   # Should return: nonroot (or error if no shell - which is expected)
#
# Verify capabilities:
#   docker inspect seq-thinking-distroless | jq '.[0].HostConfig.CapDrop'
#   docker inspect seq-thinking-distroless | jq '.[0].HostConfig.CapAdd'
#
# Verify no shell:
#   docker exec seq-thinking-distroless sh
#   # Should fail: OCI runtime exec failed: exec failed: ... executable file not found
#
# Run security tests:
#   ./scripts/docker-security-test.sh mcp/sequentialthinking:distroless
#
# Run vulnerability scan:
#   trivy image --severity HIGH,CRITICAL mcp/sequentialthinking:distroless
#
# ================================================================
# Monitoring and Maintenance
# ================================================================
#
# Monitor logs:
#   tail -f logs/combined-$(date +%Y-%m-%d).log
#   tail -f logs/security-$(date +%Y-%m-%d).log
#   tail -f logs/error-$(date +%Y-%m-%d).log
#
# Monitor container stats:
#   docker stats seq-thinking-distroless --no-stream
#
# Check memory usage:
#   docker exec seq-thinking-distroless cat /sys/fs/cgroup/memory/memory.usage_in_bytes
#   # Or use docker stats
#
# Backup logs:
#   tar -czf logs-backup-$(date +%Y%m%d).tar.gz logs/
#
# Rotate logs (Winston handles automatically):
#   # Logs rotate daily, kept for 90 days
#   # Manual rotation not needed
#
# ================================================================
# Troubleshooting
# ================================================================
#
# Container won't start:
#   1. Check logs: docker-compose -f docker-compose.distroless.yml logs
#   2. Verify image: docker images mcp/sequentialthinking:distroless
#   3. Rebuild: ./build-distroless.sh
#   4. Check ports: lsof -i :3001 (or netstat -an | grep 3001)
#
# Health endpoint not responding:
#   1. Check container status: docker ps
#   2. Check logs: docker logs seq-thinking-distroless
#   3. Test locally: curl http://localhost:3001/health
#   4. Check firewall: Ensure port 3001 is accessible
#
# Logs not being written:
#   1. Check logs directory permissions: ls -la logs/
#   2. Ensure volume mount is correct: docker inspect seq-thinking-distroless
#   3. Check container user: Should be UID 65532 (nonroot)
#   4. Fix permissions: chmod 755 logs/ && chown -R 65532:65532 logs/
#
# Out of memory errors:
#   1. Check current usage: docker stats seq-thinking-distroless
#   2. Review memory limit: 1GB should handle 10,000 thoughts
#   3. Check for memory leaks: Monitor over time
#   4. Increase limit if needed: Modify mem_limit in this file
#
# ================================================================
