version: '3.8'

services:
  # Sequential Thinking MCP Server - SSE Mode
  # Runs the server with Server-Sent Events transport on HTTP
  # Security hardened with read-only root filesystem
  sequential-thinking-sse:
    build:
      context: ../..
      dockerfile: src/sequentialthinking/Dockerfile
    image: mcp/sequentialthinking:secure
    container_name: seq-thinking-secure
    user: "1000:1000"

    # READ-ONLY ROOT FILESYSTEM (immutable container)
    read_only: true

    # Temporary filesystems (in-memory, cleared on restart)
    tmpfs:
      - /tmp:mode=1777,size=100m,uid=1000,gid=1000
      - /run:mode=0755,size=10m,uid=1000,gid=1000

    # Persistent log volume (survives container restarts)
    volumes:
      - ./logs:/app/logs:rw

    # Port binding (localhost only)
    ports:
      - "127.0.0.1:3001:3001"

    # Environment variables
    environment:
      - PORT=3001
      - DISABLE_THOUGHT_LOGGING=false
      - MAX_THOUGHTS_PER_SESSION=10000
      - MAX_THOUGHT_LENGTH=10000
      - SESSION_TIMEOUT_MS=3600000
      - NODE_ENV=production

    # Security options
    security_opt:
      - no-new-privileges:true

    # Capabilities (minimal required set)
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID

    # Resource limits
    mem_limit: 1g
    memswap_limit: 1g
    mem_reservation: 512m
    cpus: 1.0
    pids_limit: 100

    # Command (uses Dockerfile default: node dist/index.js sse)
    # No override needed - using default from Dockerfile

    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    # Restart policy
    restart: unless-stopped

  # Sequential Thinking MCP Server - stdio Mode
  # Runs the server with standard input/output (requires interactive terminal)
  # Security hardened with read-only root filesystem
  sequential-thinking-stdio:
    build:
      context: ../..
      dockerfile: src/sequentialthinking/Dockerfile
    image: mcp/sequentialthinking:secure
    user: "1000:1000"

    # READ-ONLY ROOT FILESYSTEM
    read_only: true

    # Temporary filesystems
    tmpfs:
      - /tmp:mode=1777,size=100m,uid=1000,gid=1000
      - /run:mode=0755,size=10m,uid=1000,gid=1000

    # Persistent log volume
    volumes:
      - ./logs:/app/logs:rw

    # Security options
    security_opt:
      - no-new-privileges:true

    # Capabilities
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID

    # Resource limits
    mem_limit: 1g
    memswap_limit: 1g
    mem_reservation: 512m
    cpus: 1.0
    pids_limit: 100

    # Command override for stdio mode
    command: ["node", "dist/index.js", "stdio"]

    # TTY for stdio mode
    stdin_open: true
    tty: true
