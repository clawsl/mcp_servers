events {
    worker_connections 1024;
}

http {
    # Upstream backend (MCP SSE server)
    upstream mcp_backend {
        server sequential-thinking-sse:3001;
    }

    # HTTPS Server on port 8043 (for Cursor/Windsurf)
    server {
        listen 8043 ssl http2;
        server_name localhost;

        # SSL Certificate Configuration
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # SSL Security Settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Logging
        access_log /var/log/nginx/https_access.log;
        error_log /var/log/nginx/https_error.log;

        # SSE/MCP Endpoint
        location /sse {
            proxy_pass http://mcp_backend/sse;
            proxy_http_version 1.1;

            # SSE requires these headers
            proxy_set_header Connection '';
            proxy_set_header Cache-Control 'no-cache';
            proxy_set_header X-Accel-Buffering 'no';

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for SSE
            proxy_buffering off;
            proxy_cache off;

            # Timeouts for long-lived SSE connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
        }

        # Message endpoint for POST requests
        location /message {
            proxy_pass http://mcp_backend/message;
            proxy_http_version 1.1;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy (HTTPS)\n";
            add_header Content-Type text/plain;
        }
    }

    # HTTP Server on port 3002 (for Claude Code)
    server {
        listen 3002;
        server_name localhost;

        # Logging
        access_log /var/log/nginx/http_access.log;
        error_log /var/log/nginx/http_error.log;

        # SSE/MCP Endpoint
        location /sse {
            proxy_pass http://mcp_backend/sse;
            proxy_http_version 1.1;

            # SSE requires these headers
            proxy_set_header Connection '';
            proxy_set_header Cache-Control 'no-cache';
            proxy_set_header X-Accel-Buffering 'no';

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for SSE
            proxy_buffering off;
            proxy_cache off;

            # Timeouts for long-lived SSE connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
        }

        # Message endpoint for POST requests
        location /message {
            proxy_pass http://mcp_backend/message;
            proxy_http_version 1.1;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy (HTTP)\n";
            add_header Content-Type text/plain;
        }
    }
}
